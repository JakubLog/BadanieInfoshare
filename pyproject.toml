[project]
name = "klubfit-agent-usability"
version = "0.1.0"
description = "Agent jako uczestnik badania użyteczności: eksperymenty UI / REST / MCP na systemie Klub Fit"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic>=2.7,<3",
    "mcp>=2.3,<3",
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "playwright>=1.49",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "claude-agent-sdk>=0.2.180,<0.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
